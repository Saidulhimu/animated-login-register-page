<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hour </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="page">

        <div class="stage">
            <div class="stage-caption">the arrival</div>
            <div class="ground"></div>
            <div class="ground-shadow"></div>

            <div class="desk">
                <div class="desk-leg l"></div>
                <div class="desk-leg r"></div>
                <div class="speaker" id="speaker">
                    <div class="speaker-ring r1"></div>
                    <div class="speaker-ring r2"></div>
                    <div class="speaker-ring r3"></div>
                </div>
            </div>

            <div class="character" id="character">
                <div class="briefcase">
                    <svg viewBox="0 0 26 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="5" width="24" height="13" rx="2.5" fill="#4B6C61" />
                        <rect x="9" y="1" width="8" height="5" rx="1.5" stroke="#4B6C61" stroke-width="2" />
                        <rect x="1" y="10" width="24" height="2.4" fill="#3a554c" />
                    </svg>
                </div>
                <svg viewBox="0 0 96 150">
                    <!-- back arm -->
                    <g class="arm back">
                        <rect x="60" y="52" width="9" height="34" rx="4.5" fill="#A9543D" />
                    </g>
                    <!-- back leg -->
                    <g class="leg back">
                        <rect x="41" y="96" width="11" height="40" rx="5" fill="#3B2E35" />
                    </g>
                    <!-- torso -->
                    <rect x="30" y="46" width="36" height="54" rx="16" fill="#C1694F" />
                    <!-- front leg -->
                    <g class="leg">
                        <rect x="52" y="96" width="11" height="40" rx="5" fill="#2c2229" />
                    </g>
                    <!-- front arm -->
                    <g class="arm">
                        <rect x="27" y="52" width="9" height="34" rx="4.5" fill="#C1694F" />
                    </g>
                    <!-- head group -->
                    <g class="head-bob">
                        <circle cx="48" cy="34" r="19" fill="#F0C9A8" />
                        <path d="M29 30a19 19 0 0 1 38 0c-5-3-11 2-19 2s-14-5-19-2Z" fill="#3B2E35" />
                        <circle cx="55" cy="35" r="2" fill="#3B2E35" />
                    </g>
                </svg>
            </div>

            <button class="replay-btn" id="replayBtn" title="Replay the arrival"
                aria-label="Replay animation">↻</button>
        </div>

        <div class="card-wrap">
            <div class="card" id="card">

                <div class="tabs">
                    <button class="tab active" data-tab="register" id="tabRegister">Register Now</button>
                    <button class="tab" data-tab="login" id="tabLogin">Welcome Back</button>
                </div>

                <h1 class="heading" id="heading">Register Now</h1>
                <p class="subtitle" id="subtitle">Set the briefcase down, cue the music — your workspace is ready when
                    you are.</p>

                <form id="authForm">
                    <div class="field">
                        <input type="text" id="userField" placeholder="Username or email" required
                            autocomplete="username">
                        <div class="field-underline"></div>
                    </div>
                    <div class="field">
                        <input type="password" id="passField" placeholder="Password" required
                            autocomplete="current-password">
                        <div class="field-underline"></div>
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor"
                                    stroke-width="1.7" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="spinner"></span>
                        <span class="btn-label" id="btnLabel">Create account</span>
                    </button>
                </form>

                <div class="divider">or continue with</div>

                <div class="social-row">
                    <button class="social-btn" aria-label="Continue with Google" type="button">
                        <svg viewBox="0 0 24 24">
                            <path fill="#EA4335"
                                d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2c-5.5 0-9.9 4.5-9.9 9.9s4.4 9.9 9.9 9.9c5.7 0 9.5-4 9.5-9.6 0-.7-.1-1.2-.2-1.7H12Z" />
                        </svg>
                    </button>
                    <button class="social-btn" aria-label="Continue with Facebook" type="button">
                        <svg viewBox="0 0 24 24">
                            <path fill="#1877F2"
                                d="M22 12.06C22 6.5 17.5 2 12 2S2 6.5 2 12.06c0 5 3.66 9.13 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.9h-2.34V22c4.78-.8 8.44-4.95 8.44-9.94Z" />
                        </svg>
                    </button>
                    <button class="social-btn" aria-label="Continue with X" type="button">
                        <svg viewBox="0 0 24 24">
                            <path fill="#111"
                                d="M18.9 2H22l-7.2 8.2L23.3 22h-6.6l-5.2-6.8L5.5 22H2.4l7.7-8.8L1 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.7L7.4 4H5.6l12.1 16Z" />
                        </svg>
                    </button>
                </div>

                <p class="switch-line">
                    <span id="switchText">Already have a desk here?</span>
                    <button type="button" id="switchBtn">Sign in</button>
                </p>

            </div>
        </div>

    </div>

    <div class="toast" id="toast">✓ <span id="toastMsg">You're in. Welcome to the studio.</span></div>

    <footer class="site-footer">
        <p class="footer-text">
            Design by <span class="footer-name">Md. Saidul Islam</span>
        </p>
        <a class="footer-github" href="https://github.com/Saidulhimu" target="_blank" rel="noopener noreferrer"
            aria-label="Md. Saidul Islam on GitHub">
            <svg class="gh-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 .5C5.73.5.75 5.48.75 11.75c0 5.02 3.26 9.28 7.77 10.78.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.16.69-3.83-1.34-3.83-1.34-.52-1.32-1.26-1.67-1.26-1.67-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.74 2.65 1.24 3.3.95.1-.73.4-1.24.72-1.53-2.52-.29-5.17-1.26-5.17-5.6 0-1.24.44-2.24 1.17-3.03-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.16a10.9 10.9 0 0 1 5.72 0c2.18-1.47 3.14-1.16 3.14-1.16.62 1.57.23 2.73.11 3.02.73.79 1.17 1.79 1.17 3.03 0 4.35-2.65 5.31-5.18 5.59.41.36.77 1.06.77 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.66.79.55A11.26 11.26 0 0 0 23.25 11.75C23.25 5.48 18.27.5 12 .5Z" />
            </svg>
            <span class="gh-label">github.com/Saidulhimu</span>
        </a>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
